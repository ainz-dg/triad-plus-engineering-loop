name: Publish stable GitHub Release to npm

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Stable vMAJOR.MINOR.PATCH tag to validate without publishing
        required: true
        default: v1.22.2
        type: string
      expected_commit:
        description: Exact full SHA approved at the current main head
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: triad-plus-release-${{ github.event.release.tag_name || inputs.release_tag || github.run_id }}
  cancel-in-progress: false

jobs:
  gate:
    name: Validate, test, and build the exact release archive
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      artifact_name: ${{ steps.package.outputs.artifact_name }}
      tarball_name: ${{ steps.package.outputs.tarball_name }}
      sha256: ${{ steps.package.outputs.sha256 }}
      sidecar_sha256: ${{ steps.package.outputs.sidecar_sha256 }}
      integrity: ${{ steps.package.outputs.integrity }}
      shasum: ${{ steps.package.outputs.shasum }}
    steps:
      - name: Check out the immutable release event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 for npm Trusted Publishing
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm CLI to the Trusted Publishing minimum
        run: |
          npm install --global npm@11.5.1
          node --version
          npm --version

      - name: Validate the event, exact main commit, and immutable conflicts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
        run: node scripts/release/release-guard.mjs gate

      - name: Reuse CI Cockpit build
        run: npm run cockpit:build

      - name: Require committed Cockpit assets to remain reproducible
        run: git diff --exit-code -- cockpit/dist

      - name: Reuse CI Cockpit tests
        run: npm run cockpit:test

      - name: Reuse CI project tests
        run: npm test

      - name: Reuse CI package checks
        run: npm run pack:check

      - name: Check whitespace errors
        run: git diff --check

      - name: Run package prepublishOnly gate explicitly
        run: npm run prepublishOnly

      - name: Pack, inspect, and smoke-install one exact archive
        id: package
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.release_tag }}
        run: node scripts/release/release-guard.mjs package

      - name: Preserve the verified archive for the release event only
        if: ${{ github.event_name == 'release' }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: |
            ${{ steps.package.outputs.tarball_path }}
            ${{ steps.package.outputs.sidecar_path }}
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish-npm:
    name: Publish the verified archive to npm with OIDC
    needs: gate
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the immutable release event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm CLI to the Trusted Publishing minimum
        run: npm install --global npm@11.5.1

      - name: Download the archive produced after every gate passed
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/verified-release

      - name: Verify archive identity and repeat the fail-closed preflight
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.gate.outputs.sha256 }}
          EXPECTED_SIDECAR_SHA256: ${{ needs.gate.outputs.sidecar_sha256 }}
          EXPECTED_INTEGRITY: ${{ needs.gate.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.gate.outputs.shasum }}
          ARTIFACT_DIR: ${{ runner.temp }}/verified-release
        run: |
          node scripts/release/release-guard.mjs verify-artifact
          node scripts/release/release-guard.mjs publish-preflight

      - name: Publish the exact verified archive with provenance
        env:
          TARBALL_NAME: ${{ needs.gate.outputs.tarball_name }}
        run: npm publish "${{ runner.temp }}/verified-release/$TARBALL_NAME" --provenance --access public

      - name: Verify npm version, integrity, and shasum with bounded retries
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_INTEGRITY: ${{ needs.gate.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.gate.outputs.shasum }}
        run: node scripts/release/release-guard.mjs verify-registry

  publish-release-assets:
    name: Add only the two verified assets to the existing Release
    needs:
      - gate
      - publish-npm
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out the immutable release event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Download the exact verified archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/verified-release

      - name: Upload missing assets only; reject conflicts and never overwrite
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.gate.outputs.sha256 }}
          EXPECTED_SIDECAR_SHA256: ${{ needs.gate.outputs.sidecar_sha256 }}
          ARTIFACT_DIR: ${{ runner.temp }}/verified-release
        run: |
          node scripts/release/release-guard.mjs verify-artifact
          node scripts/release/release-guard.mjs upload-release-assets

  verify-published:
    name: Verify npm, tag, Release assets, and registry install
    needs:
      - gate
      - publish-npm
      - publish-release-assets
    if: ${{ github.event_name == 'release' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the immutable release event commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 and npm registry
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Pin npm CLI to the Trusted Publishing minimum
        run: npm install --global npm@11.5.1

      - name: Download the original verified archive
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.gate.outputs.artifact_name }}
          path: ${{ runner.temp }}/verified-release

      - name: Verify exact archive, tag, and current Release metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.gate.outputs.sha256 }}
          EXPECTED_SIDECAR_SHA256: ${{ needs.gate.outputs.sidecar_sha256 }}
          EXPECTED_INTEGRITY: ${{ needs.gate.outputs.integrity }}
          EXPECTED_SHASUM: ${{ needs.gate.outputs.shasum }}
          ARTIFACT_DIR: ${{ runner.temp }}/verified-release
          RELEASE_JSON_PATH: ${{ runner.temp }}/release.json
        run: |
          node scripts/release/release-guard.mjs verify-artifact
          node scripts/release/release-guard.mjs verify-tag
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" > "$RELEASE_JSON_PATH"
          node scripts/release/release-guard.mjs verify-release

      - name: Download Release assets and verify exact bytes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          EXPECTED_ARCHIVE_SHA256: ${{ needs.gate.outputs.sha256 }}
          EXPECTED_SIDECAR_SHA256: ${{ needs.gate.outputs.sidecar_sha256 }}
          ARTIFACT_DIR: ${{ runner.temp }}/verified-release
          RELEASE_DOWNLOAD_DIR: ${{ runner.temp }}/release-assets
        run: node scripts/release/release-guard.mjs verify-release-downloads

      - name: Smoke-install the exact published registry version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INSTALL_PREFIX: ${{ runner.temp }}/registry-install
        run: node scripts/release/release-guard.mjs registry-smoke
